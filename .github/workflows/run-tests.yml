name: Tests

on:
  push:
    branches:
      - 'develop'
      - 'staging'
      - 'production'
    paths:
      - .github/workflows/**
      - 'lustra/**'
      - 'extensions/**'
      - 'tools/**'
      - 'app/icon-utils.js'
      - 'app/test/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '!lustra/vcs/version.py'
  # every pull request, docs-only ones included: 'Tests passed' is a required check of the branch ruleset, and a
  # workflow skipped by a path filter would leave it pending forever
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref }} || concat(${{ github.ref }}, ${{ github.workflow }})
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt
          pip install 'anthropic>=2.9'  # optional AI extra: its SDK wire test (local server, no key) runs too
      - name: Run tests
        continue-on-error: False
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=140 --statistics
          python -m unittest lustra/tests/tests.py
          python -m unittest lustra.tests.test_lustra lustra.tests.test_gender lustra.tests.test_security lustra.tests.test_batch_b lustra.tests.test_batch_c lustra.tests.test_batch_c_tags lustra.tests.test_batch_d_core lustra.tests.test_batch_d_search lustra.tests.test_batch_d_app lustra.tests.test_extgen lustra.tests.test_dlindex lustra.tests.test_dlindex_tools lustra.tests.test_model_server lustra.tests.test_media_verify lustra.tests.test_catalog_trust lustra.tests.test_aigen_eval lustra.tests.test_gender_eval lustra.tests.test_tag_sources
          node app/test/icon-utils.test.js

  # the one check the ruleset of develop, staging and production requires: every job of the matrix passed
  passed:
    name: Tests passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != success ]; then echo "::error::test jobs: $RESULT"; exit 1; fi
          echo "test jobs: $RESULT"
